name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Format + lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Cheap job: the mypy hook only checks `src` and pulls its own
      # dependencies, so this needs none of the heavy ML stack.
      - uses: pre-commit/action@v3.0.1

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported: pyproject requires >=3.11,<3.14.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # `uv.lock` is gitignored (see .gitignore), so dependencies are resolved
      # fresh here rather than installed `--frozen`. `--all-extras` pulls the
      # `dev` extra (pytest, pytest-cov). Two dependencies install from git
      # (CineMA, dinov3), so this step is the slow one.
      - name: Install package
        run: uv sync --all-extras

      - name: Test package
        run: >-
          uv run pytest -ra --cov --cov-report=term --durations=20
