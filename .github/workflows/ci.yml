name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Format + lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Cheap job: the mypy hook only checks `src` and pulls its own
      # dependencies, so this needs none of the heavy ML stack.
      - uses: pre-commit/action@v3.0.1

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported: pyproject requires >=3.11,<3.14.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # `uv.lock` is gitignored, so key the dependency cache on the file that
          # actually determines resolution. Without this setup-uv warns that its
          # cache can never be invalidated.
          cache-dependency-glob: pyproject.toml

      # Installed with `uv pip` rather than `uv sync` specifically so that
      # `--torch-backend=cpu` applies: it is a `uv pip` feature, and the project
      # interface (`uv lock` / `uv sync`) rejects the flag and silently ignores
      # the UV_TORCH_BACKEND env var. The runners have no GPU, and the default
      # Linux wheels pull in 18 CUDA/nvidia packages (151 -> 132 resolved
      # packages, several GB of downloads).
      #
      # This is CI-only: pyproject.toml is untouched, so Isambard-AI SLURM runs
      # and local installs still get the normal CUDA-enabled build.
      #
      # `uv.lock` is gitignored, so dependencies resolve fresh rather than
      # `--frozen`. Two dependencies install from git (CineMA, dinov3).
      #
      # `.[dev]` rather than `--all-extras`, which `uv pip` rejects for a path
      # target. `dev` is currently the only extra -- add new ones here too.
      - name: Install package
        run: |
          uv venv --allow-existing
          uv pip install --torch-backend=cpu ".[dev]"

      # `--no-sync`, because a bare `uv run` would sync the project and undo the
      # CPU-only install above.
      - name: Test package
        run: >-
          uv run --no-sync pytest -ra --cov --cov-report=term --durations=20
